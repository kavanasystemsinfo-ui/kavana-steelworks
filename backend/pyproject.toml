[project]
name = "kavana-steelworks"
version = "0.1.0"
description = "KAVANA Steelworks - MES/MOM para el sector metalurgico: bobinas de acero, FIFO, reconciliacion industrial, OEE, trazabilidad ISO 9001"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# Gate de lint = app/ y tests/ (decisión de Jorge, 2026-10-27, opción A).
# Fuera del gate a propósito: alembic/versions (migraciones históricas, 88 issues)
# y los scripts manuales de la raíz (e2e_*.py, 29; test_neg.py, 9). No se limpian
# en esta fase: son ficheros ya ejecutados o de uso manual, y tocarlos es riesgo
# sin retorno. Con este exclude, `ruff check .` y el paso de CI dan lo mismo.
extend-exclude = ["alembic", "e2e_*.py", "test_neg.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
